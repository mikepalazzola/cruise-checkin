<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cruise Check-In Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #0077b6, #023e8a);
      color: white;
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header p  { font-size: 13px; opacity: 0.8; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-white  { background: white; color: #023e8a; }
    .btn-green  { background: #28a745; color: white; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-card .number { font-size: 36px; font-weight: 700; color: #023e8a; }
    .stat-card .label  { font-size: 12px; color: #666; margin-top: 4px; }
    .stat-card.green  .number { color: #28a745; }
    .stat-card.orange .number { color: #fd7e14; }
    .stat-card.red    .number { color: #dc3545; }

    /* ── Progress bar ── */
    .progress-wrap {
      background: white;
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .progress-label { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 6px; }
    .progress-bar   { height: 12px; background: #e9ecef; border-radius: 6px; overflow: hidden; display: flex; }
    .progress-fill-in  { height: 100%; background: #28a745; transition: width 0.4s ease; }
    .progress-fill-out { height: 100%; background: #dc3545; transition: width 0.4s ease; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .search-box:focus { border-color: #0077b6; }

    .filter-btn {
      padding: 9px 14px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      background: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      color: #555;
      white-space: nowrap;
    }
    .filter-btn.active         { background: #0077b6; border-color: #0077b6; color: white; }
    .filter-btn.active.green   { background: #28a745; border-color: #28a745; }
    .filter-btn.active.red     { background: #dc3545; border-color: #dc3545; }
    .filter-btn.active.orange  { background: #fd7e14; border-color: #fd7e14; }

    /* ── Table ── */
    .table-wrap {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    thead { background: #f8f9fa; }
    th { padding: 11px 16px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; font-weight: 600; }
    td { padding: 13px 16px; font-size: 14px; color: #333; border-top: 1px solid #f1f3f5; }
    tr:hover td { background: #f8f9fa; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-in       { background: #d4edda; color: #155724; }
    .badge-out      { background: #f8d7da; color: #721c24; }

    .ts { font-size: 12px; color: #888; white-space: nowrap; }

    .no-data { text-align: center; padding: 40px; color: #aaa; }
    .last-updated { text-align: right; font-size: 12px; color: #aaa; margin-top: 10px; }

    .action-wrap { display: flex; gap: 6px; flex-wrap: wrap; }
    .override-btn {
      padding: 3px 10px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
      font-size: 12px;
      cursor: pointer;
      color: #555;
      white-space: nowrap;
    }
    .override-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🚢 Cruise Check-In Dashboard</h1>
      <p id="lastUpdated">Loading…</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-white" onclick="loadData()">🔄 Refresh</button>
      <button class="btn btn-green" onclick="exportCSV()">⬇️ Export CSV</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="number" id="statTotal">—</div>
      <div class="label">Total Invited</div>
    </div>
    <div class="stat-card green">
      <div class="number" id="statIn">—</div>
      <div class="label">On Board</div>
    </div>
    <div class="stat-card red">
      <div class="number" id="statOut">—</div>
      <div class="label">Departed</div>
    </div>
    <div class="stat-card orange">
      <div class="number" id="statPending">—</div>
      <div class="label">Not Arrived</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span>
        <span style="color:#28a745;">■</span> On Board &nbsp;
        <span style="color:#dc3545;">■</span> Departed
      </span>
      <span id="progressPct">0% boarded</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill-in"  id="progressIn"  style="width:0%"></div>
      <div class="progress-fill-out" id="progressOut" style="width:0%"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input class="search-box" type="search" placeholder="🔍  Search by name…" id="searchBox" oninput="renderTable()" />
    <button class="filter-btn active"  id="filterAll"     onclick="setFilter('all')">All</button>
    <button class="filter-btn"         id="filterIn"      onclick="setFilter('in')">🚢 On Board</button>
    <button class="filter-btn"         id="filterOut"     onclick="setFilter('out')">🏁 Departed</button>
    <button class="filter-btn"         id="filterPending" onclick="setFilter('pending')">⏳ Not Arrived</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Status</th>
          <th>Check-In Time</th>
          <th>Check-Out Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" class="no-data">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="last-updated" id="refreshNote"></div>

  <script>
    // ─────────────────────────────────────────────
    // CONFIGURATION
    // ─────────────────────────────────────────────
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxNatHKuopNBEWhqq1lDe-VC-EdJAbf82q2RCfGKHr4fwAGXLRKfilOFBUmzEtXZxnm/exec';

    let allData   = [];
    let curFilter = 'all';

    async function loadData() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=list`);
        const data = await res.json();
        allData = data.attendees || [];
        updateStats();
        renderTable();
        const now = new Date();
        document.getElementById('lastUpdated').textContent  = `Last updated: ${now.toLocaleTimeString()}`;
        document.getElementById('refreshNote').textContent  = `Auto-refreshes every 15 seconds · ${now.toLocaleString()}`;
      } catch (e) {
        document.getElementById('tableBody').innerHTML =
          '<tr><td colspan="6" class="no-data">⚠️ Could not load data. Check your connection.</td></tr>';
      }
    }

    function updateStats() {
      const total   = allData.length;
      const onBoard = allData.filter(a => a.checkedIn && !a.checkedOut).length;
      const depart  = allData.filter(a => a.checkedOut).length;
      const pending = allData.filter(a => !a.checkedIn).length;
      const pctIn   = total ? Math.round((onBoard / total) * 100) : 0;
      const pctOut  = total ? Math.round((depart  / total) * 100) : 0;

      document.getElementById('statTotal').textContent   = total;
      document.getElementById('statIn').textContent      = onBoard;
      document.getElementById('statOut').textContent     = depart;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('progressPct').textContent = `${pctIn}% boarded`;
      document.getElementById('progressIn').style.width  = `${pctIn}%`;
      document.getElementById('progressOut').style.width = `${pctOut}%`;
    }

    function setFilter(f) {
      curFilter = f;
      const map = { all: 'filterAll', in: 'filterIn', out: 'filterOut', pending: 'filterPending' };
      const colorMap = { in: 'green', out: 'red', pending: 'orange' };
      Object.entries(map).forEach(([key, id]) => {
        const btn = document.getElementById(id);
        btn.classList.toggle('active', key === f);
        if (key === f && colorMap[key]) btn.classList.add(colorMap[key]);
        else btn.classList.remove('green','red','orange');
      });
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchBox').value.toLowerCase().trim();
      let rows = allData;
      if (curFilter === 'in')      rows = rows.filter(a => a.checkedIn && !a.checkedOut);
      if (curFilter === 'out')     rows = rows.filter(a => a.checkedOut);
      if (curFilter === 'pending') rows = rows.filter(a => !a.checkedIn);
      if (q) rows = rows.filter(a => a.name.toLowerCase().includes(q));

      if (!rows.length) {
        document.getElementById('tableBody').innerHTML =
          '<tr><td colspan="6" class="no-data">No matching attendees.</td></tr>';
        return;
      }

      document.getElementById('tableBody').innerHTML = rows.map((a, i) => {
        let badge, statusLabel;
        if (a.checkedOut)       { badge = 'badge-out';     statusLabel = '🏁 Departed'; }
        else if (a.checkedIn)   { badge = 'badge-in';      statusLabel = '🚢 On Board'; }
        else                    { badge = 'badge-pending';  statusLabel = '⏳ Pending'; }

        const actions = [];
        if (!a.checkedIn) {
          actions.push(`<button class="override-btn" onclick="doAction('checkin','${encodeURIComponent(a.name)}')">Mark In</button>`);
        }
        if (a.checkedIn && !a.checkedOut) {
          actions.push(`<button class="override-btn" onclick="doAction('checkout','${encodeURIComponent(a.name)}')">Mark Out</button>`);
          actions.push(`<button class="override-btn" onclick="doAction('undo','${encodeURIComponent(a.name)}')">Undo In</button>`);
        }
        if (a.checkedOut) {
          actions.push(`<button class="override-btn" onclick="doAction('undocheckout','${encodeURIComponent(a.name)}')">Undo Out</button>`);
        }

        return `
          <tr>
            <td style="color:#aaa;">${i + 1}</td>
            <td style="font-weight:500;">${a.name}</td>
            <td><span class="badge ${badge}">${statusLabel}</span></td>
            <td class="ts">${a.checkInTime  || '—'}</td>
            <td class="ts">${a.checkOutTime || '—'}</td>
            <td><div class="action-wrap">${actions.join('')}</div></td>
          </tr>`;
      }).join('');
    }

    async function doAction(action, encodedName) {
      const name = decodeURIComponent(encodedName);
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=${action}&name=${encodedName}`);
        const data = await res.json();
        if (data.success) {
          await loadData();
        } else {
          alert(data.message || 'Action failed.');
        }
      } catch (e) {
        alert('Network error — please try again.');
      }
    }

    function exportCSV() {
      const header = 'Name,Status,Check-In Time,Check-Out Time\n';
      const rows   = allData.map(a => {
        let status = a.checkedOut ? 'Departed' : a.checkedIn ? 'On Board' : 'Not Arrived';
        return `"${a.name}","${status}","${a.checkInTime || ''}","${a.checkOutTime || ''}"`;
      }).join('\n');
      const blob = new Blob([header + rows], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href     = url;
      link.download = `cruise-checkin-${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    loadData();
    setInterval(loadData, 15000);
  </script>

</body>
</html>
