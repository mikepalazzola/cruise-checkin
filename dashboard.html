<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cruise Check-In Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #0077b6, #023e8a);
      color: white;
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { font-size: 22px; font-weight: 700; }
    header p  { font-size: 13px; opacity: 0.8; margin-top: 2px; }

    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-white  { background: white; color: #023e8a; }
    .btn-green  { background: #28a745; color: white; }
    .btn-orange { background: #fd7e14; color: white; }

    /* ---- Stats row ---- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-card .number { font-size: 40px; font-weight: 700; color: #023e8a; }
    .stat-card .label  { font-size: 13px; color: #666; margin-top: 4px; }

    .stat-card.green  .number { color: #28a745; }
    .stat-card.orange .number { color: #fd7e14; }

    /* ---- Progress bar ---- */
    .progress-wrap {
      background: white;
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .progress-label { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 8px; }
    .progress-bar   { height: 12px; background: #e9ecef; border-radius: 6px; overflow: hidden; }
    .progress-fill  { height: 100%; background: linear-gradient(90deg, #0077b6, #28a745); border-radius: 6px; transition: width 0.4s ease; }

    /* ---- Controls ---- */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    .search-box:focus { border-color: #0077b6; }

    .filter-btn {
      padding: 10px 16px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      background: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      color: #555;
    }
    .filter-btn.active       { background: #0077b6; border-color: #0077b6; color: white; }
    .filter-btn.active.green { background: #28a745; border-color: #28a745; }
    .filter-btn.active.red   { background: #dc3545; border-color: #dc3545; }

    /* ---- Attendee table ---- */
    .table-wrap {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #f8f9fa; }
    th { padding: 12px 18px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; font-weight: 600; }
    td { padding: 14px 18px; font-size: 14px; color: #333; border-top: 1px solid #f1f3f5; }

    tr:hover td { background: #f8f9fa; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-in  { background: #d4edda; color: #155724; }
    .badge-out { background: #ffeeba; color: #856404; }

    .no-data { text-align: center; padding: 40px; color: #aaa; }

    .last-updated { text-align: right; font-size: 12px; color: #aaa; margin-top: 10px; }

    /* Manual override button */
    .override-btn {
      padding: 4px 10px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
      font-size: 12px;
      cursor: pointer;
      color: #555;
    }
    .override-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🚢 Cruise Check-In Dashboard</h1>
      <p id="lastUpdated">Loading…</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-white" onclick="loadData()">🔄 Refresh</button>
      <button class="btn btn-green" onclick="exportCSV()">⬇️ Export CSV</button>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="number" id="statTotal">—</div>
      <div class="label">Total Invited</div>
    </div>
    <div class="stat-card green">
      <div class="number" id="statIn">—</div>
      <div class="label">Checked In</div>
    </div>
    <div class="stat-card orange">
      <div class="number" id="statOut">—</div>
      <div class="label">Not Yet In</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Check-in progress</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <input class="search-box" type="search" placeholder="🔍  Search by name…" id="searchBox" oninput="renderTable()" />
    <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
    <button class="filter-btn" id="filterIn" onclick="setFilter('in')">✅ Checked In</button>
    <button class="filter-btn" id="filterOut" onclick="setFilter('out')">⏳ Not Yet</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Status</th>
          <th>Check-In Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" class="no-data">Loading…</td></tr>
      </tbody>
    </table>
  </div>
  <div class="last-updated" id="refreshNote"></div>

  <script>
    // ─────────────────────────────────────────────
    // CONFIGURATION — replace with your deployed
    // Google Apps Script Web App URL after setup
    // ─────────────────────────────────────────────
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxusemYESkLPCL3nPQS4uffbjqWDqIqGIzT2RYwD6DaEzSG5GVuf690hsnhU_AE2p7d/exec';

    let allData   = [];
    let curFilter = 'all';

    async function loadData() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=list`);
        const data = await res.json();
        allData = data.attendees || [];
        updateStats();
        renderTable();
        const now = new Date();
        document.getElementById('lastUpdated').textContent =
          `Last updated: ${now.toLocaleTimeString()}`;
        document.getElementById('refreshNote').textContent =
          `Auto-refreshes every 15 seconds · ${now.toLocaleString()}`;
      } catch (e) {
        document.getElementById('tableBody').innerHTML =
          '<tr><td colspan="5" class="no-data">⚠️ Could not load data. Check your connection.</td></tr>';
      }
    }

    function updateStats() {
      const total  = allData.length;
      const inCnt  = allData.filter(a => a.checkedIn).length;
      const outCnt = total - inCnt;
      const pct    = total ? Math.round((inCnt / total) * 100) : 0;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statIn').textContent    = inCnt;
      document.getElementById('statOut').textContent   = outCnt;
      document.getElementById('progressPct').textContent = `${pct}%`;
      document.getElementById('progressFill').style.width = `${pct}%`;
    }

    function setFilter(f) {
      curFilter = f;
      ['all','in','out'].forEach(id => {
        const btn = document.getElementById('filter' + id.charAt(0).toUpperCase() + id.slice(1));
        btn.classList.toggle('active', id === f);
      });
      renderTable();
    }

    function renderTable() {
      const q = document.getElementById('searchBox').value.toLowerCase().trim();

      let rows = allData;
      if (curFilter === 'in')  rows = rows.filter(a => a.checkedIn);
      if (curFilter === 'out') rows = rows.filter(a => !a.checkedIn);
      if (q) rows = rows.filter(a => a.name.toLowerCase().includes(q));

      if (!rows.length) {
        document.getElementById('tableBody').innerHTML =
          '<tr><td colspan="5" class="no-data">No matching attendees.</td></tr>';
        return;
      }

      document.getElementById('tableBody').innerHTML = rows.map((a, i) => `
        <tr>
          <td style="color:#aaa;">${i + 1}</td>
          <td style="font-weight:500;">${a.name}</td>
          <td>
            <span class="badge ${a.checkedIn ? 'badge-in' : 'badge-out'}">
              ${a.checkedIn ? '✅ Checked In' : '⏳ Pending'}
            </span>
          </td>
          <td style="color:#888;">${a.timestamp || '—'}</td>
          <td>
            ${a.checkedIn
              ? `<button class="override-btn" onclick="toggleCheckin('${encodeURIComponent(a.name)}', false)">Undo</button>`
              : `<button class="override-btn" onclick="toggleCheckin('${encodeURIComponent(a.name)}', true)">Mark In</button>`
            }
          </td>
        </tr>
      `).join('');
    }

    async function toggleCheckin(encodedName, checkin) {
      const name   = decodeURIComponent(encodedName);
      const action = checkin ? 'checkin' : 'undo';
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=${action}&name=${encodedName}`);
        const data = await res.json();
        if (data.success) {
          const idx = allData.findIndex(a => a.name === name);
          if (idx !== -1) {
            allData[idx].checkedIn  = checkin;
            allData[idx].timestamp  = checkin ? new Date().toLocaleTimeString() : '';
          }
          updateStats();
          renderTable();
        } else {
          alert(data.message || 'Action failed.');
        }
      } catch (e) {
        alert('Network error — please try again.');
      }
    }

    function exportCSV() {
      const header = 'Name,Status,Check-In Time\n';
      const rows   = allData.map(a =>
        `"${a.name}","${a.checkedIn ? 'Checked In' : 'Not Checked In'}","${a.timestamp || ''}"`
      ).join('\n');
      const blob = new Blob([header + rows], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `cruise-checkin-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    loadData();
    setInterval(loadData, 15000);   // Auto-refresh every 15 seconds
  </script>

</body>
</html>
